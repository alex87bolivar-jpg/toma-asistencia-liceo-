<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liceo ANT. - Inicio de sesión</title>
  <link rel="stylesheet" href="styles/login.css">
  <link rel="stylesheet" href="styles/home.css">
</head>
<body>

  <main class="login-page">

    <!-- Panel izquierdo -->
    <section class="welcome-panel">
      <div class="top-decoration"></div>

      <header class="brand">
        <div class="logo">
          <div class="logo-inner">Ⅱ</div>
        </div>
        <span>LICEO ANT.</span>
      </header>

      <div class="leaf leaf-1"></div>
      <div class="leaf leaf-2"></div>
      <div class="leaf leaf-3"></div>

      <div class="book-decoration">
        <span></span>
        <span></span>
      </div>

      <div class="welcome-text">
        <h1>Cada<br>Día<br>Cuenta</h1>
        <div class="yellow-line"></div>
      </div>

      <div class="spark spark-1">✦</div>
      <div class="spark spark-2">✦</div>

      <div class="motto">
        <p>Educación hoy,<br>un mejor mañana.</p>
        <div class="small-line"></div>
      </div>

      <div class="bottom-wave"></div>
    </section>

    <!-- Panel derecho -->
    <section class="form-panel">
      <div class="corner-decoration"></div>

      <div class="form-content">
        <h2>Inicio sesión</h2>
        <div class="separator"></div>

        <p class="subtitle">Ingresa tus datos</p>

        <form>
          <label for="email">Correo institucional</label>
          <div class="input-box">
            <span class="input-icon">@</span>
            <input id="email" type="email" placeholder="usuario@licant.edu.co">
          </div>

          <label for="password">Contraseña</label>
          <div class="input-box">
            <span class="input-icon password-icon">⚿</span>
            <input id="password" type="password" placeholder="Ingresa tu contraseña">
          </div>

          <button type="submit">Ingresar al sistema</button>

          <div class="forgot">
            <p>¿Olvidaste tu contraseña?</p>
            <a href="#">Restablecer</a>
          </div>
        </form>
      </div>

      <div class="right-bottom-wave"></div>
      <div class="yellow-spark">✦</div>
    </section>

  </main>

</body>
<script src="tomaasistencia.js"></script>
</html>
